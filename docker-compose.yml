x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://procurement:procurement@db:5432/procurement
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-please-32chars}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@procurement-platform.dev}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hashing}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
      POSTGRES_DB: procurement
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *api-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["rq", "worker", "reports", "--url", "redis://redis:6379/0"]
    environment: *api-env
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://procurement:procurement@db:5432/procurement_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  qdrantdata:
