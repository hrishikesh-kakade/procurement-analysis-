[project]
name = "procurement-intelligence-platform"
version = "1.0.0"
description = "Procurement Intelligence Platform - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]
